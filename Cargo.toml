[package]
name = "rustyai"
version = "0.1.0"
edition = "2021"
authors = ["RustyAI Contributors"]
description = "A comprehensive, next-generation machine learning and data science library for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mecoserra2008/Rustyai"
keywords = ["machine-learning", "deep-learning", "data-science", "statistics", "ai"]
categories = ["science", "algorithms", "mathematics"]
readme = "README.md"

[dependencies]
# Core numerical computing
ndarray = { version = "0.16", features = ["rayon", "serde"] }
ndarray-rand = "0.15"
ndarray-linalg = { version = "0.16", optional = true }
nalgebra = { version = "0.33", optional = true }
num-traits = "0.2"
num-complex = "0.4"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Parallel computing
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Optimization and special functions
approx = "0.5"
special = "0.10"

# For neural networks
autograd = { version = "1.1", optional = true }

# DataFrame support
polars = { version = "0.45", optional = true, features = ["lazy"] }

# Python interop
pyo3 = { version = "0.23", optional = true, features = ["extension-module"] }

# SIMD support (note: packed_simd is outdated, using std::simd when stable)

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
approx = "0.5"

[features]
default = ["std"]
std = []
blas = ["ndarray-linalg"]
nalgebra-backend = ["nalgebra"]
python = ["pyo3", "polars"]
full = ["blas", "nalgebra-backend", "python"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
